# Тесты на Windows: WPF живёт только там, и половина тестов поднимает настоящие окна.
# В конце — сводка первых по времени падений: когда падает общий поток интерфейса, все
# следующие тесты валятся одинаковым «A task was canceled», и причина видна лишь у первого.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Коммит, ветка или тег, на котором прогнать тесты (пусто — тот, откуда запуск)'
        required: false
        default: ''

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test Amarin.AdminAI.Tests/Amarin.AdminAI.Tests.csproj --logger "trx;LogFileName=tests.trx" --results-directory test-results

      - name: First failures
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem test-results -Recurse -Filter *.trx -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $trx) { 'No test results were written.'; exit 0 }
          [xml]$doc = Get-Content -Raw $trx.FullName
          $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
          $results = @(Select-Xml -Xml $doc -XPath '//t:UnitTestResult' -Namespace $ns | ForEach-Object Node |
            Sort-Object { [datetime]$_.startTime })
          $failed = @($results | Where-Object outcome -eq 'Failed')
          $cancelled = { param($r) "$($r.Output.ErrorInfo.Message)" -match 'A task was canceled' }
          "Total: $($results.Count), failed: $($failed.Count)"

          ''
          '--- Failed by class'
          $failed | Group-Object { ($_.testName -replace '\(.*$', '') -replace '\.[^.]+$', '' } |
            Sort-Object Count -Descending | ForEach-Object { "{0,4}  {1}" -f $_.Count, $_.Name }

          # Первый «A task was canceled» — момент, когда умер общий поток интерфейса; тесты перед
          # ним — главные подозреваемые.
          $first = $results | Where-Object { $_.outcome -eq 'Failed' -and (& $cancelled $_) } | Select-Object -First 1
          if ($first) {
            $at = [array]::IndexOf($results, $first)
            ''
            '--- Tests that ran just before the UI thread died'
            $results[[math]::Max(0, $at - 8)..$at] | ForEach-Object { "{0,-8} {1}" -f $_.outcome, $_.testName }
          }

          ''
          '--- Failures that are not a dead UI thread'
          foreach ($result in $failed | Where-Object { -not (& $cancelled $_) }) {
            ''
            "=== $($result.testName)"
            (("$($result.Output.ErrorInfo.Message)" -split "`n") | Select-Object -First 6) -join "`n"
            (("$($result.Output.ErrorInfo.StackTrace)" -split "`n") | Select-Object -First 4) -join "`n"
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore
