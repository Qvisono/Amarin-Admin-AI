# Выпуск релиза. Запускается пушем в main, который приносит заметки к новой версии
# (.github/release-notes/v<версия>.md), или вручную. Собирает на Windows, потому что только
# там живёт WPF: и тесты с настоящими окнами, и публикация одним файлом идут здесь, а не на
# машине того, кто выпускает.
name: Release

on:
  push:
    branches: [main]
    paths:
      - '.github/release-notes/**'
  workflow_dispatch:

permissions:
  contents: write

# Два пуша подряд не должны собирать один релиз наперегонки.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Версия берётся из csproj — там она живёт вместе с подписью в MainWindow.xaml, и
      # второй копии номера здесь быть не должно.
      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -Raw 'Amarin Admin AI/Amarin Admin AI.csproj'
          $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if (-not $version) { throw 'No <Version> in the csproj.' }
          $notes = ".github/release-notes/v$version.md"
          if (-not (Test-Path $notes)) { throw "No release notes at $notes." }
          $title = (Get-Content $notes -TotalCount 1 -Encoding utf8) -replace '^#\s*', ''
          "version=$version" >> $env:GITHUB_OUTPUT
          "notes=$notes" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT

      # Тесты не останавливают выпуск, но их итог лежит в артефакте test-results: смотреть его
      # обязательно, прежде чем объявлять релиз готовым.
      - name: Test
        continue-on-error: true
        timeout-minutes: 30
        run: dotnet test Amarin.AdminAI.Tests/Amarin.AdminAI.Tests.csproj --logger "trx;LogFileName=tests.trx" --logger "console;verbosity=normal" --results-directory test-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore

      # Ровно эти флаги — см. CLAUDE.md: без них рядом с exe остаются нативные библиотеки или
      # файл выходит вдвое тяжелее.
      - name: Publish
        id: publish
        shell: pwsh
        run: |
          dotnet publish "Amarin Admin AI/Amarin Admin AI.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o release/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $asset = "release/Amarin-Admin-AI-v${{ steps.version.outputs.version }}-win-x64.exe"
          Move-Item "release/publish/Amarin Admin AI.exe" $asset
          "asset=$asset" >> $env:GITHUB_OUTPUT

      # Повторный запуск той же версии не падает на «релиз уже есть», а заменяет файл и заметки.
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
          TITLE: ${{ steps.version.outputs.title }}
          NOTES: ${{ steps.version.outputs.notes }}
          ASSET: ${{ steps.publish.outputs.asset }}
        run: |
          # «Релиза нет» — это ответ, а не авария: ненулевой код gh здесь не должен ронять шаг.
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $env:ASSET --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $env:TAG --title $env:TITLE --notes-file $env:NOTES
          } else {
            gh release create $env:TAG $env:ASSET --target $env:GITHUB_SHA --title $env:TITLE --notes-file $env:NOTES
          }
          exit $LASTEXITCODE
