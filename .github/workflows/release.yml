# Выпуск релиза. Запускается пушем в main, который приносит заметки к новой версии
# (.github/release-notes/v<версия>.md), или вручную. Собирает на Windows, потому что только
# там живёт WPF: и тесты с настоящими окнами, и публикация одним файлом идут здесь, а не на
# машине того, кто выпускает.
name: Release

on:
  push:
    branches: [main]
    paths:
      - '.github/release-notes/**'
  workflow_dispatch:

permissions:
  contents: write

# Два пуша подряд не должны собирать один релиз наперегонки.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    # Секреты в условиях шагов недоступны напрямую — только через окружение.
    env:
      SIGNING_CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Версия берётся из csproj — там она живёт вместе с подписью в UI/Settings/SettingsView.xaml, и
      # второй копии номера здесь быть не должно.
      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -Raw 'Amarin Admin AI/Amarin Admin AI.csproj'
          $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if (-not $version) { throw 'No <Version> in the csproj.' }
          $notes = ".github/release-notes/v$version.md"
          if (-not (Test-Path $notes)) { throw "No release notes at $notes." }
          $title = (Get-Content $notes -TotalCount 1 -Encoding utf8) -replace '^#\s*', ''
          "version=$version" >> $env:GITHUB_OUTPUT
          "notes=$notes" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT

      # Тесты без окон останавливают выпуск: они на раннере надёжны, и красный среди них —
      # настоящая поломка.
      - name: Test (without windows)
        timeout-minutes: 25
        run: dotnet test Amarin.AdminAI.Tests/Amarin.AdminAI.Tests.csproj --filter "Category!=Wpf" --logger "trx;LogFileName=tests.trx" --logger "console;verbosity=minimal" --results-directory test-results/core

      # Что именно остановило выпуск — аннотациями, как в CI: журнал и артефакт GitHub
      # показывает только после входа, а аннотации видны всем.
      - name: Failed tests
        if: failure()
        shell: pwsh
        run: |
          $trx = Get-ChildItem test-results/core -Recurse -Filter *.trx -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $trx) { '::error title=Tests::No test results were written.'; exit 0 }
          [xml]$doc = Get-Content -Raw $trx.FullName
          $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
          $failed = @(Select-Xml -Xml $doc -XPath "//t:UnitTestResult[@outcome='Failed']" -Namespace $ns | ForEach-Object Node | ForEach-Object {
            "$($_.testName): $((("$($_.Output.ErrorInfo.Message)" -split "`n") | Select-Object -First 1).Trim())"
          })
          $escape = { param($text) $text -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A' }
          $failed | Select-Object -First 9 | ForEach-Object { "::error title=Failed test::$(& $escape $_)" }
          if ($failed.Count -gt 9) {
            "::error title=More failed tests::$(& $escape (($failed | Select-Object -Skip 9) -join "`n"))"
          }

      # Оконные тесты выпуск не останавливают (на раннере они ненадёжны), но их итог лежит
      # в артефакте test-results: смотреть его обязательно, прежде чем объявлять релиз готовым.
      - name: Test (windows)
        continue-on-error: true
        timeout-minutes: 30
        run: dotnet test Amarin.AdminAI.Tests/Amarin.AdminAI.Tests.csproj --filter "Category=Wpf" --logger "trx;LogFileName=tests.trx" --logger "console;verbosity=normal" --results-directory test-results/wpf

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore

      # Ровно эти флаги — см. CLAUDE.md: без них рядом с exe остаются нативные библиотеки или
      # файл выходит вдвое тяжелее.
      - name: Publish
        id: publish
        shell: pwsh
        run: |
          dotnet publish "Amarin Admin AI/Amarin Admin AI.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o release/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $asset = "release/Amarin-Admin-AI-v${{ steps.version.outputs.version }}-win-x64.exe"
          Move-Item "release/publish/Amarin Admin AI.exe" $asset
          "asset=$asset" >> $env:GITHUB_OUTPUT

      # Подпись — только если в репозитории заведён сертификат. Программа ставит обновление,
      # подписанное тем же издателем, что и установленная сборка; неподписанную проверяет по
      # SHA256SUMS ниже. Подписывать нужно до подсчёта суммы: подпись меняет байты файла.
      - name: Sign
        if: env.SIGNING_CERT_PFX_BASE64 != ''
        shell: pwsh
        env:
          ASSET: ${{ steps.publish.outputs.asset }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found.' }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT_PFX_BASE64))
          try {
            & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:SIGNING_CERT_PASSWORD $env:ASSET
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      # Подпись проверяется тем же способом, что и у человека на машине: подписанный файл с
      # битой или неполной подписью программа как обновление не примет (AuthenticodeCheck), и
      # выложить такой — значит оставить всех на прежней версии.
      - name: Verify signature
        if: env.SIGNING_CERT_PFX_BASE64 != ''
        shell: pwsh
        env:
          ASSET: ${{ steps.publish.outputs.asset }}
        run: |
          $signature = Get-AuthenticodeSignature -FilePath $env:ASSET
          if ($signature.Status -ne 'Valid') {
            throw "Signature is $($signature.Status): $($signature.StatusMessage)"
          }
          "Signed by: $($signature.SignerCertificate.Subject)"

      # Контрольная сумма вторым вложением. GitHub сообщает её в поле digest не у всех
      # релизов, а без суммы программа не обновляется сама — только по отдельному согласию.
      # Формат sha256sum: «сумма, два пробела, имя», перевод строки LF, без BOM.
      - name: Checksums
        id: sums
        shell: pwsh
        env:
          ASSET: ${{ steps.publish.outputs.asset }}
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 $env:ASSET).Hash.ToLowerInvariant()
          $name = Split-Path $env:ASSET -Leaf
          $sums = 'release/SHA256SUMS'
          [IO.File]::WriteAllText($sums, "$hash  $name`n", [Text.UTF8Encoding]::new($false))
          "sums=$sums" >> $env:GITHUB_OUTPUT

      # Сумма сверяется с самим файлом прямо перед выкладкой: между подсчётом и выкладкой шагов
      # больше нет, но формат строки («сумма, два пробела, имя») читает и программа, и опечатка
      # в нём означала бы релиз, который никто не сможет поставить сам.
      - name: Verify checksums
        shell: pwsh
        env:
          ASSET: ${{ steps.publish.outputs.asset }}
          SUMS: ${{ steps.sums.outputs.sums }}
        run: |
          $line = [IO.File]::ReadAllText($env:SUMS)
          if ($line -notmatch '^([0-9a-f]{64})  (\S+)\n$') { throw "Malformed SHA256SUMS: '$line'" }
          $expected = $Matches[1]
          if ($Matches[2] -ne (Split-Path $env:ASSET -Leaf)) { throw "SHA256SUMS names $($Matches[2])" }
          $actual = (Get-FileHash -Algorithm SHA256 $env:ASSET).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Checksum mismatch: $actual vs $expected" }

      # Повторный запуск той же версии не падает на «релиз уже есть», а заменяет файл и заметки.
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
          TITLE: ${{ steps.version.outputs.title }}
          NOTES: ${{ steps.version.outputs.notes }}
          ASSET: ${{ steps.publish.outputs.asset }}
          SUMS: ${{ steps.sums.outputs.sums }}
        run: |
          # «Релиза нет» — это ответ, а не авария: ненулевой код gh здесь не должен ронять шаг.
          $PSNativeCommandUseErrorActionPreference = $false
          # Версия с пометкой (1.29.0-beta.1) выходит предварительной: /releases/latest её не
          # отдаёт, и программа предлагает её только тем, кто включил бета-канал.
          $pre = @()
          if ($env:TAG.Contains('-')) { $pre = @('--prerelease') }
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $env:ASSET $env:SUMS --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $env:TAG --title $env:TITLE --notes-file $env:NOTES @pre
          } else {
            gh release create $env:TAG $env:ASSET $env:SUMS --target $env:GITHUB_SHA --title $env:TITLE --notes-file $env:NOTES @pre
          }
          exit $LASTEXITCODE
