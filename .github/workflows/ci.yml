# Проверка на каждый пуш и pull request: сборка без единого предупреждения и тесты без окон.
#
# Оконные тесты (метка Category=Wpf) здесь не идут: на раннере GitHub общий поток интерфейса
# то не стартует, то умирает, и красная отметка на каждом пуше была бы шумом. Их гоняет ручной
# workflow «Tests», а «зелёно» для них по-прежнему значит зелёный dotnet test на настоящей машине.
name: CI

on:
  push:
  pull_request:

# Новый пуш в ту же ветку делает прежний прогон ненужным.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Любое новое предупреждение — баг (CLAUDE.md), поэтому здесь оно ошибка сборки.
      - name: Build
        run: dotnet build Amarin.AdminAI.Tests/Amarin.AdminAI.Tests.csproj -c Release -warnaserror

      - name: Test (without windows)
        timeout-minutes: 25
        run: dotnet test Amarin.AdminAI.Tests/Amarin.AdminAI.Tests.csproj -c Release --no-build --filter "Category!=Wpf" --logger "trx;LogFileName=tests.trx" --logger "console;verbosity=minimal" --results-directory test-results

      # Прогон локальных инструментов на настоящей Windows (H6). Выпуск не держит: части
      # компонентов (Hyper-V, Wi-Fi) на раннере нет — такие строки помечены SKIP, — а остальное
      # зависит от образа раннера. Итог — таблицей в сводке шага.
      - name: Smoke-test tools
        continue-on-error: true
        timeout-minutes: 20
        shell: pwsh
        run: |
          $exe = Get-ChildItem 'Amarin Admin AI/bin/Release' -Recurse -Filter 'Amarin Admin AI.exe' | Select-Object -First 1
          if (-not $exe) { throw 'The program was not built.' }
          $report = Join-Path $env:RUNNER_TEMP 'smoke.md'
          $process = Start-Process -FilePath $exe.FullName -ArgumentList @('--smoke-report', $report) -Wait -PassThru
          if (Test-Path $report) {
            Get-Content -Raw $report >> $env:GITHUB_STEP_SUMMARY
            Get-Content $report
          } else {
            'The smoke test wrote no report.' >> $env:GITHUB_STEP_SUMMARY
          }
          exit $process.ExitCode

      # Сколько тестов прошло — чтобы «зелёно» не значило «ничего не запустилось». Упавшие —
      # ещё и аннотациями: сводку шага, журнал и артефакт GitHub показывает только после входа,
      # а аннотации видны на странице коммита и через API всем. GitHub берёт до десяти ошибок на
      # шаг, поэтому сверх девяти — одной общей строкой.
      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem test-results -Recurse -Filter *.trx -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $trx) { 'No test results were written.' >> $env:GITHUB_STEP_SUMMARY; exit 0 }
          [xml]$doc = Get-Content -Raw $trx.FullName
          $c = $doc.TestRun.ResultSummary.Counters
          $line = "Tests: $($c.total) total, $($c.passed) passed, $($c.failed) failed, $($c.notExecuted) skipped"
          $line
          "### $line" >> $env:GITHUB_STEP_SUMMARY
          $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
          $failed = @(Select-Xml -Xml $doc -XPath "//t:UnitTestResult[@outcome='Failed']" -Namespace $ns | ForEach-Object Node | ForEach-Object {
            "$($_.testName): $((("$($_.Output.ErrorInfo.Message)" -split "`n") | Select-Object -First 1).Trim())"
          })
          foreach ($test in $failed) { "- $test" >> $env:GITHUB_STEP_SUMMARY }
          $escape = { param($text) $text -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A' }
          $failed | Select-Object -First 9 | ForEach-Object { "::error title=Failed test::$(& $escape $_)" }
          if ($failed.Count -gt 9) {
            "::error title=More failed tests::$(& $escape (($failed | Select-Object -Skip 9) -join "`n"))"
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-test-results
          path: test-results
          if-no-files-found: ignore
