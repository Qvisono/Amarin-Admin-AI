n{width:22px;height:22px}.attachment{display:none;margin:2px 8px 6px;padding:7px 9px;border:1px solid #363c45;border-radius:9px;font-size:12px;justify-content:space-between;align-items:center;gap:6px}.attachment.show{display:flex}.attachment span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.attachment button{min-width:32px;min-height:32px}.veil{position:absolute;inset:0;background:#0008;z-index:2;opacity:0;pointer-events:none;transition:opacity .2s}.drawer{position:absolute;inset:0 auto 0 0;width:calc(100% - 44px);max-width:360px;background:#101215;border-right:1px solid #282c31;z-index:3;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .2s ease-out;padding:0 14px 14px}.app.side .drawer{transform:translateX(0)}.app.side .veil{opacity:1;pointer-events:auto}.drawer-head{padding:36px 8px 0;height:90px;flex:none;display:flex;align-items:flex-start;gap:9px;font-size:21px;font-weight:500;letter-spacing:-.6px}.drawer-head .brand{width:24px;height:24px;color:#d24b5f}.history-filter{height:44px;text-align:left;color:#969da7;font-size:13px;padding:0 10px;display:flex;align-items:center;gap:8px}.history-filter .icon{width:12px;height:12px}.history{min-height:0;overflow:auto;flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;padding:10px 0 12px}.chat-row{min-height:46px;flex:none;text-align:left;border-radius:11px;padding:12px;font-size:14px;color:#bdc2cb;display:flex;align-items:center;gap:10px}.chat-row .icon{width:17px;height:17px;color:#777f8c}.chat-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat-row.active{background:#24282e;color:#f1f2f4}.chat-row.active .icon{color:#bec6d1}.footer{flex:none}.search-row{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px}.search{height:44px;background:#1d2025;border:1px solid #292e36;border-radius:12px;display:flex;align-items:center;gap:9px;padding:0 12px}.search .icon{width:16px;height:16px;color:#8b939e}.search input{border:0;bac gap:8px;margin-bottom:24px}.subtop h2{font-size:21px;font-weight:500}.settings-row{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 10px;font-size:15px}.navtile{width:28px;height:28px;border-radius:50%;display:grid;place-items:center}.navtile svg{width:18px;height:18px}.group-label{font-size:11px;color:#89919b;margin:24px 10px 8px}.settings-group{background:#1b1e23;border-radius:15px;padding:4px}.settings-row:after{content:'›';margin-left:auto;color:#87909c}.empty-search{font-size:14px;color:#9aa2af;padding:16px 10px}.hidden{display:none!important}@media(prefers-reduced-motion:reduce){.drawer,.veil{transition:none}}@media(max-width:420px){header.preview{margin-top:16px}.stage{padding:0 0 16px}.app{border-radius:0;border-left:0;border-right:0}.note{line-height:1.5}}@media(min-width:500px){body.shot .stage{padding:0}body.shot .preview,body.shot .note{display:none}}

</style></head><body>
<header class="preview"><strong>Amarin Chat · концепт 02</strong><div class="tools"><button data-demo="chat">Чат</button><button data-demo="sidebar">Sidebar</button><button data-demo="empty">Пустой</button><select aria-label="Ширина экрана" id="width"><option>390</option><option>320</option><option>360</option><option>430</option></select></div></header>
<main class="stage"><section class="app" aria-label="Макет Amarin Chat">
<div class="chat"><div class="top"><button class="icon-btn" id="openSidebar" aria-label="Открыть список чатов"><span class="menu-face" data-icon="menu"></span></button><button class="title" id="chatTitle">Выходные у моря</button></div><div class="messages" id="messages"></div><div class="dock"><div class="composer"><div class="attachment" id="attachment"><span></span><button aria-label="Убрать вложение">×</button></div><textarea class="input" id="message" rows="1" placeholder="Напишите сообщение…" aria-label="Сообщение"></textarea><div class="toolbar"><button class="icon-btn attach" id="attach" aria-label="Прикрепить файл" data-icon="plus"></button><button class="model" id="model" aria-label="Модель Kimi K2, размышление High"><span class="model-face"><svg class="model-logo" viewBox="0 0 24 24"><path d="__KIMI__"/></svg><span class="model-name">Kimi K2</span><span class="effort">· High</span><svg class="icon chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span></button><button class="metrics" id="metrics" aria-label="Контекст 3 тысячи из 128 тысяч токенов. Баланс 12 долларов 40 центов"><span class="context"><span class="ring"></span>3k/128k</span><span>$12.40</span></button><button class="send" id="send" disabled aria-label="Отправить"><span class="send-face" data-icon="send"></span></button></div></div></div></div>
<button class="veil" aria-label="Вернуться в чат" id="veil" tabindex="-1"></button><aside class="drawer" aria-label="Список чатов" inert><div class="drawer-head"><svg class="brand" viewBox="0 0 24 24"><path d="__BRAND__" fill="currentColor"/></svg>Amarin</div><button class="history-filter" id="filter">Все чаты <span data-icon="chevron"></span></button><div class="history" id="history"></div><div class="footer"><div class="search-row"><label class="search"><span data-icon="search"></span><input id="search" placeholder="Поиск" aria-label="Поиск по чатам"></label><button class="new-chat" id="newChat" aria-label="Новый чат" data-icon="new"></button></div><div class="profile-row"><button class="profile" id="profile"><span class="avatar">A</span><span class="profile-name">Александр</span></button><button class="icon-btn settings-btn" id="settings" aria-label="Настройки"><svg class="icon" viewBox="0 0 24 24" style="stroke:none;fill:currentColor"><path d="__GEAR__" fill-rule="evenodd"/></svg></button></div></div></aside>
<button class="sheet-scrim" aria-label="Закрыть панель" tabindex="-1"></button><section class="sheet" role="dialog" aria-modal="true" aria-label="Параметры"></section><section class="subpage" aria-label="Настройки"><div class="subtop"><button class="icon-btn" id="settingsBack" aria-label="Назад" data-icon="back"></button><h2>Настройки</h2></div><div id="settingsList"></div></section><input class="hidden" id="file" type="file"></section></main>
<p class="note">Интерактивный макет, без подключения к API. Данные условные. Свайп вправо открывает sidebar.</p>
<script>
const app=document.querySelector('.app'),drawer=document.querySelector('.drawer'),chat=document.querySelector('.chat'),input=document.querySelector('#message'),send=document.querySelector('#send'),history=document.querySelector('#history'),sheet=document.querySelector('.sheet');
const paths={menu:'M5 8h14M5 16h14',plus:'M12 5v14M5 12h14',search:'M20 20l-4-4M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0',send:'M12 19V5m-6 6 6-6 6 6',chevron:'m7 10 5 5 5-5',back:'m14 6-6 6 6 6',new:'M8 4H5a2 2 0 0 0-2 2v13h13a2 2 0 0 0 2-2v-3M10 14l1-4 7-7 3 3-7 7-4 1',chat:'M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 3v-3H3V6a2 2 0 0 1 2-2'};
function icon(name){return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]}"/></svg>`}document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
const titles=['Идеи для квартиры','Письмо коллеге','Что почитать осенью','План тренировок','Выходные у моря'];let active='Выходные у моря',effort='High',returnFocus=null;
function drawHistory(){history.replaceChildren();const query=document.querySelector('#search').value.toLowerCase();titles.filter(x=>x.toLowerCase().includes(query)).forEach(title=>{let b=document.createElement('button');b.className='chat-row'+(title===active?' active':'');b.innerHTML=icon('chat');let span=document.createElement('span');span.textContent=title;b.append(span);b.onclick=()=>{active=title;document.querySelector('#chatTitle').textContent=title;side(false);};history.append(b)});if(!history.children.length){history.innerHTML='<p class="empty-search">Ничего не найдено</p>'}}
function side(open){app.classList.toggle('side',open);drawer.inert=!open;chat.inert=open;document.querySelector('#veil').tabIndex=open?0:-1;if(open)input.blur();else document.querySelector('#openSidebar').focus({preventScroll:true})}
document.querySelector('#openSidebar').onclick=()=>side(true);document.querySelector('#veil').onclick=()=>side(false);document.querySelector('#search').oninput=drawHistory;
function empty(){document.querySelector('#messages').innerHTML='<div class="hero"><svg class="hero-logo" viewBox="0 0 24 24"><path d="__BRAND__" fill="currentColor"/></svg><div class="hero-name">Amarin Chat</div></div>';document.querySelector('#chatTitle').textContent='Новый чат';input.value='';resizeInput()}
function conversation(){document.querySelector('#messages').innerHTML='<div class="user-msg">Хочу на два дня к морю.<br>Без плотного расписания.</div><div class="answer"><p>Тогда оставим по одному плану на день — и время просто побыть у воды.</p><h3>Суббота</h3><p>Поздний завтрак и прогулка вдоль берега. После — пляж или кафе, которое понравится по дороге.</p><h3>Воскресенье</h3><p>Утром заглянуть в старый город.<br>Обратную дорогу оставить на вечер.</p></div>';document.querySelector('#chatTitle').textContent='Выходные у моря'}
document.querySelector('#newChat').onclick=()=>{empty();side(false);active='';drawHistory()};
function resizeInput(){input.style.height='43px';input.style.height=Math.min(125,Math.max(43,input.scrollHeight))+'px';send.disabled=!input.value.trim()&&!document.querySelector('#file').files.length}input.oninput=resizeInput;
send.onclick=()=>{if(send.disabled)return;document.querySelector('.hero')?.remove();let msg=document.createElement('div');msg.className='user-msg';msg.textContent=input.value||document.querySelector('#file').files[0]?.name;document.querySelector('#messages').append(msg);input.value='';document.querySelector('#attachment').classList.remove('show');document.querySelector('#file').value='';resizeInput();msg.scrollIntoView({block:'end'})};
document.querySelector('#attach').onclick=()=>document.querySelector('#file').click();document.querySelector('#file').onchange=e=>{const f=e.target.files[0];if(f){document.querySelector('#attachment span').textContent=f.name;document.querySelector('#attachment').classList.add('show')}resizeInput()};document.querySelector('#attachment button').onclick=()=>{document.querySelector('#file').value='';document.querySelector('#attachment').classList.remove('show');resizeInput()};
function openSheet(html){returnFocus=document.activeElement;sheet.innerHTML=html;app.classList.add('sheet-open');sheet.setAttribute('aria-label',sheet.querySelector('h2')?.textContent||'Параметры');chat.inert=true;drawer.inert=true;sheet.querySelector('button')?.focus()}
function closeSheet(){app.classList.remove('sheet-open');drawer.inert=!app.classList.contains('side');chat.inert=app.classList.contains('side');returnFocus?.focus({preventScroll:true})}document.querySelector('.sheet-scrim').onclick=closeSheet;
document.querySelector('#model').onclick=()=>{openSheet('<h2>Модель</h2><button class="choice selected">Kimi K2</button><p>Уровень размышления</p><div class="efforts">'+['Low','Medium','High'].map(x=>`<button class="${x===effort?'selected':''}" data-effort="${x}">${x}</button>`).join('')+'</div><button class="choice apply" id="apply">Применить</button>');let choice=effort;sheet.querySelectorAll('[data-effort]').forEach(b=>b.onclick=()=>{choice=b.dataset.effort;sheet.querySelectorAll('[data-effort]').forEach(x=>x.classList.toggle('selected',x===b))});sheet.querySelector('#apply').onclick=()=>{effort=choice;document.querySelector('.effort').textContent='· '+choice;document.querySelector('#model').setAttribute('aria-label','Модель Kimi K2, размышление '+choice);closeSheet()}};
document.querySelector('#metrics').onclick=()=>openSheet('<h2>Контекст и баланс</h2><dl><dt>Контекст</dt><dd>3 000 / 128 000</dd><dt>Заполнено</dt><dd>2,3%</dd><dt>Остаток</dt><dd>$12.40</dd></dl><p>Демонстрационные значения.</p>');
document.querySelector('#profile').onclick=()=>openSheet('<h2>Профиль</h2><button class="choice selected">Александр</button><p>Локальный профиль</p>');document.querySelector('#filter').onclick=()=>{openSheet('<h2>Показать</h2>'+['Все чаты','Закреплённые','Папки','Архив'].map(t=>`<button class="choice">${t}</button>`).join(''));sheet.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelector('#filter').innerHTML=b.textContent+' '+icon('chevron');closeSheet()})};
document.querySelector('#chatTitle').onclick=()=>openSheet('<h2>Выходные у моря</h2><p>Действия текущего чата</p><button class="choice" id="demoRename">Переименовать</button>');
document.querySelector('#settings').onclick=()=>{app.classList.add('settings-open');drawer.inert=true};document.querySelector('#settingsBack').onclick=()=>{app.classList.remove('settings-open');drawer.inert=false;document.querySelector('#settings').focus()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(app.classList.contains('sheet-open'))closeSheet();else if(app.classList.contains('settings-open'))document.querySelector('#settingsBack').click();else side(false)}if(e.key==='Tab'&&app.classList.contains('sheet-open')){const controls=[...sheet.querySelectorAll('button,input')];if(!controls.length){e.preventDefault();return}const first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
let start=null;app.addEventListener('pointerdown',e=>{if(e.target.closest('button,input,textarea,.sheet,.subpage'))return;start={x:e.clientX,y:e.clientY}});app.addEventListener('pointerup',e=>{if(!start)return;let dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.abs(dx)>54&&Math.abs(dx)>Math.abs(dy)*1.4)side(dx>0)});app.addEventListener('pointercancel',()=>start=null);
document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>{app.classList.remove('settings-open','sheet-open');if(b.dataset.demo==='empty')empty();else conversation();side(b.dataset.demo==='sidebar')});document.querySelector('#width').onchange=e=>app.style.width=e.target.value+'px';
drawHistory();conversation();
const groups=__SETTINGS__;document.querySelector('#settingsList').innerHTML=groups.map(g=>`<div class="group-label">${g.name}</div><div class="settings-group">${g.items.map(i=>`<div class="settings-row"><span class="navtile" style="background:${i.color}"><svg class="icon" viewBox="0 0 24 24"><path d="${i.path}"/></svg></span>${i.title}</div>`).join('')}</div>`).join('');
const params=new URLSearchParams(location.search);if(params.has('shot'))document.body.classList.add('shot');if(params.has('w')){app.style.width=params.get('w')+'px';document.querySelector('#width').value=params.get('w')}if(params.get('state')==='sidebar')side(true);if(params.get('state')==='empty')empty();if(params.get('state')==='typed'){input.value='А где лучше остановиться?';resizeInput()}
</script></body></html>
